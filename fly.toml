app = "tally-d469c8"
primary_region = "iad"

[build]

[env]
  TALLY_SIGNUP = "first"
  TALLY_SECURE_COOKIES = "1"

[[mounts]]
  source = "tally_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
