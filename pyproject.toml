[project]
name = "tally"
version = "0.1.0"
description = "Private, simple tracking for substance use and habits you want to change."
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "argon2-cffi>=23.1",
    "fastapi>=0.115",
    "sqlalchemy>=2.0",
    "tzdata>=2024.1",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = ["httpx>=0.27", "pytest>=8", "ruff>=0.6"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]
"app/cli.py" = ["S311"]
